name: CI

on:
  push:
    branches:
      - main
    # A release tag runs CI again, so a publish can confirm the tagged
    # commit is green.
    tags:
      - "v*"
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      # CI skips the browser leg and the browser, ffmpeg and sound-server
      # steps it needs. Consumers of the current patch exercise none of that
      # through CI. The leg stays mandatory on workstations, where the gate
      # keeps it by default.
      - name: Run the gate
        run: ./tools/check.sh
        env:
          CHAAYA_SKIP_BROWSER: "1"
