name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      # The browser audio checks measure a recorded take with ffmpeg and ffprobe.
      # The digest pins the image so every run gets the same static binary pair.
      - name: Install static ffmpeg and ffprobe
        run: |
          cid=$(docker create mwader/static-ffmpeg:7.1@sha256:a8090df5f5608daef387e1b2e93b98aaacb4d92153ad904e7d715c725724fca4)
          docker cp "${cid}:/ffmpeg" /usr/local/bin/ffmpeg
          docker cp "${cid}:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$cid"
      - name: Run the gate
        run: ./tools/check.sh
